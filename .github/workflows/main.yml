# Github actions CI file
# Ryan Mulhall 2020
# CI testing for the FRE-NCtools repo, builds and runs unit tests
# image dockerfile is maintained here:
# https://gitlab.gfdl.noaa.gov/fre/hpc-me

name: FRE-NCtools CI Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: [push, pull_request]

jobs:
  # ---------------------------------------------------------
  # 1. Basic CI (formerly main.yml)
  # ---------------------------------------------------------
  ci:
    name: FRE-NCtools CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with_mpi: ['','--with-mpi']
        enable_quad_precision: ['', '--enable-quad-precision']
    container:
      image: ghcr.io/noaa-gfdl/fre-nctools-ci-rocky-gnu:14.2.0_v2
    env:
      MPI: ${{ matrix.with_mpi }}
      QUAD_P: ${{ matrix.enable_quad_precision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          ls
          pwd
          mkdir build && cd build
          autoreconf -i ../configure.ac
          ../configure $MPI $QUAD_P || cat config.log

      - name: Build
        # Due to how some compilers handle the Fortran module files, we
        # need to run the build twice
        run: make -C build -j || make -C build -j

      - name: Run most tests (skip the slow ones)
        run: make -C build -j check

      - name: Save log file on failure
        uses: actions/upload-artifact@v4.4.0
        if: failure()
        with:
          name: test-suites-ci
          path: |
            build/tests/test-suite.log

  # ---------------------------------------------------------
  # 2. Expensive Checks (formerly main_expensive.yml)
  # ---------------------------------------------------------
  expensive:
    name: Check Expensive
    needs: ci # <--- This tells GitHub to wait for 'ci' to pass
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with_mpi: ['','--with-mpi']
        enable_quad_precision: ['', '--enable-quad-precision']
    container:
      image: ghcr.io/noaa-gfdl/fre-nctools-ci-rocky-gnu:14.2.0_v2
    env:
      MPI: ${{ matrix.with_mpi }}
      QUAD_P: ${{ matrix.enable_quad_precision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          ls
          pwd
          mkdir build && cd build
          autoreconf -i ../configure.ac
          ../configure $MPI $QUAD_P || cat config.log

      - name: Build
        run: make -C build -j

      - name: Run most tests (skip the slow ones)
        run: make -C build check-very-expensive

      - name: Save log file on failure
        uses: actions/upload-artifact@v4.4.0
        if: failure()
        with:
          name: test-suites-expensive
          path: |
            build/tests/test-suite.log

  # ---------------------------------------------------------
  # 3. Distcheck (formerly distcheck.yml)
  # ---------------------------------------------------------
  distcheck:
    name: End-to-end distribution check
    needs: expensive # <--- This tells GitHub to wait for 'expensive' to pass
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with_mpi: ['','--with-mpi']
        enable_quad_precision: ['', '--enable-quad-precision']
    container:
      image: ghcr.io/noaa-gfdl/fre-nctools-ci-rocky-gnu:14.2.0_v2
    env:
      MPI: ${{ matrix.with_mpi }}
      QUAD_P: ${{ matrix.enable_quad_precision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          ls
          pwd
          mkdir build && cd build
          autoreconf -i ../configure.ac
          ../configure $MPI $QUAD_P || cat config.log

      - name: Build distribution with check
        run: make distcheck  -C build -j DISTCHECK_CONFIGURE_FLAGS="$MPI $QUAD_P"

      - name: Save log file on failure
        uses: actions/upload-artifact@v4.4.0
        if: failure()
        with:
          name: test-suites-distcheck
          path: |
            build/tests/test-suite.log
